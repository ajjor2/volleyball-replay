<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Stats Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .view { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app" class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-4">Volleyball Stats Analyzer</h1>

        <!-- Main Input -->
        <div id="main-input-view" class="mb-6">
            <label for="team-url" class="block mb-2 text-sm font-medium text-gray-900">Team Matches URL:</label>
            <div class="flex">
                <input type="text" id="team-url" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-l-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="https://lentopallo-api.torneopal.net/taso/rest/getMatches?team_id=...">
                <button id="load-data-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-lg">Load</button>
            </div>
        </div>

        <!-- Views Container -->
        <div id="views-container">
            <!-- Match List View -->
            <div id="match-list-view" class="view">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-2xl font-bold">Match List</h2>
                    <button id="view-season-stats-btn" class="bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">View Season Stats</button>
                </div>
                <div id="match-list-content"></div>
            </div>

            <!-- Match Replay View -->
            <div id="match-replay-view" class="view">
                <h2 class="text-2xl font-bold mb-2">Match Replay</h2>
                <button class="back-to-list-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mb-4">Back to Match List</button>
                <div id="match-replay-content"></div>
            </div>

            <!-- Stats View -->
            <div id="stats-view" class="view">
                <h2 class="text-2xl font-bold mb-2">Aggregate Season Stats</h2>
                 <button class="back-to-list-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mb-4">Back to Match List</button>
                <div id="stats-content" class="space-y-6">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                             <h3 class="text-xl font-bold">Team Stats</h3>
                             <button id="ai-analysis-btn" class="bg-teal-500 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded">Get AI Analysis</button>
                        </div>
                        <div class="flex space-x-2 mb-2">
                            <button id="export-csv-btn" class="bg-gray-500 text-white px-3 py-1 rounded">Export CSV</button>
                            <button id="export-json-btn" class="bg-gray-500 text-white px-3 py-1 rounded">Export JSON</button>
                        </div>
                        <div id="team-stats-table"></div>
                    </div>
                     <div>
                        <h3 class="text-xl font-bold mb-2">Opponent Stats</h3>
                        <div id="opponent-stats-table"></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h3 class="text-xl font-bold mb-2">Total Points per Player</h3>
                            <canvas id="points-chart"></canvas>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold mb-2">Player Plus/Minus (+/-)</h3>
                            <canvas id="plus-minus-chart"></canvas>
                        </div>
                        <div class="md:col-span-2">
                            <h3 class="text-xl font-bold mb-2">Rotation Plus/Minus (+/-)</h3>
                            <canvas id="rotation-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Roles View -->
            <div id="roles-view" class="view">
                <h2 class="text-2xl font-bold mb-2">Player Roles</h2>
                 <button class="back-to-list-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mb-4">Back to Match List</button>
                <div id="roles-content"></div>
            </div>

            <!-- AI Analysis View -->
            <div id="ai-analysis-view" class="view">
                <h2 class="text-2xl font-bold mb-2">AI Analysis</h2>
                 <button class="back-to-list-btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mb-4">Back to Stats</button>
                <div id="ai-analysis-content" class="bg-white p-4 rounded shadow">
                    <div class="space-y-4">
                         <div>
                            <label for="openrouter-key" class="block text-sm font-medium">OpenRouter API Key:</label>
                            <input type="password" id="openrouter-key" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="ai-model-select" class="block text-sm font-medium">Select Model:</label>
                            <select id="ai-model-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                                <option>openai/gpt-4o-mini</option>
                                <option>anthropic/claude-3-haiku-20240307</option>
                            </select>
                        </div>
                        <button id="get-insights-btn" class="bg-green-500 text-white px-4 py-2 rounded">Get Insights</button>
                    </div>
                    <div id="ai-response-container" class="mt-4 p-4 border-t">
                        <h3 class="font-bold">AI Insights:</h3>
                        <div id="ai-response" class="mt-2 text-gray-700 whitespace-pre-wrap"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-xs text-gray-500 p-4">
        <p>Note: If data fails to load, a CORS proxy may be required to access the API.</p>
    </footer>

    <script>
        // --- VIEW MANAGEMENT ---
        const views = {
            'match-list': document.getElementById('match-list-view'),
            'match-replay': document.getElementById('match-replay-view'),
            'stats': document.getElementById('stats-view'),
            'roles': document.getElementById('roles-view'),
            'ai-analysis': document.getElementById('ai-analysis-view')
        };

        function showView(viewName) {
            Object.values(views).forEach(view => view.classList.remove('active-view'));
            if (views[viewName]) {
                views[viewName].classList.add('active-view');
            }
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            // Initially, no view is shown until data is loaded.
        });

        document.getElementById('load-data-btn').addEventListener('click', () => {
            // In the next step, this will trigger the API call
            // For now, let's just show the match list view as a placeholder
            showView('match-list');
        });

        // Add event listeners for all "Back to Match List" buttons
        document.querySelectorAll('.back-to-list-btn').forEach(button => {
            button.addEventListener('click', () => showView('match-list'));
        });

        // --- API & DATA HANDLING ---
        const API_BASE_URL = 'https://lentopallo-api.torneopal.net/taso/rest/';
        const CACHE_EXPIRATION_MS = 60 * 60 * 1000; // 1 hour

        async function fetchData(url) {
            const cacheKey = `cache_${url}`;
            const cachedItem = localStorage.getItem(cacheKey);

            if (cachedItem) {
                const { timestamp, data } = JSON.parse(cachedItem);
                if (Date.now() - timestamp < CACHE_EXPIRATION_MS) {
                    console.log('Loading from cache:', url);
                    return data;
                } else {
                    localStorage.removeItem(cacheKey);
                }
            }

            console.log('Fetching from API:', url);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                const itemToCache = {
                    timestamp: Date.now(),
                    data: data
                };
                localStorage.setItem(cacheKey, JSON.stringify(itemToCache));

                return data;
            } catch (error) {
                console.error("Failed to fetch data:", error);
                throw error; // Re-throw to be caught by the caller
            }
        }

        async function loadTeamData() {
            const teamUrlInput = document.getElementById('team-url');
            const url = teamUrlInput.value.trim();

            if (!url.startsWith(API_BASE_URL + 'getMatches')) {
                alert('Invalid URL. Please use a getMatches URL from the lentopallo-api.');
                return;
            }

            try {
                const teamData = await fetchData(url);
                allMatchesData = teamData.matches; // Store the match list
                console.log('Team data loaded:', teamData);
                renderMatchList(teamData);
                document.getElementById('view-season-stats-btn').addEventListener('click', calculateAndRenderAggregateStats);
                showView('match-list');
            } catch (error) {
                const errorContainer = document.getElementById('main-input-view');
                let errorMsg = document.getElementById('error-message');
                if (!errorMsg) {
                    errorMsg = document.createElement('p');
                    errorMsg.id = 'error-message';
                    errorMsg.className = 'text-red-500 text-sm mt-2';
                    errorContainer.appendChild(errorMsg);
                }
                errorMsg.textContent = 'Failed to load data. Please check the URL and your network connection.';
            }
        }

        document.getElementById('load-data-btn').addEventListener('click', loadTeamData);

        // --- RENDERING ---
        function renderMatchList(data) {
            const contentDiv = document.getElementById('match-list-content');
            contentDiv.textContent = ''; // Clear previous content safely

            if (!data.matches || data.matches.length === 0) {
                contentDiv.textContent = 'No matches found for this team.';
                return;
            }

            const table = document.createElement('table');
            table.className = 'min-w-full bg-white border';

            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headerRow.className = 'bg-gray-200 text-left';
            ['Date', 'Match', 'Score', 'Actions'].forEach(text => {
                const th = document.createElement('th');
                th.className = 'py-2 px-4 border-b';
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            data.matches.forEach(match => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-100';

                const dateTd = document.createElement('td');
                dateTd.className = 'py-2 px-4 border-b';
                dateTd.textContent = new Date(match.date).toLocaleDateString();
                tr.appendChild(dateTd);

                const matchTd = document.createElement('td');
                matchTd.className = 'py-2 px-4 border-b';
                matchTd.textContent = `${match.team_A_name} vs ${match.team_B_name}`;
                tr.appendChild(matchTd);

                const scoreTd = document.createElement('td');
                scoreTd.className = 'py-2 px-4 border-b';
                scoreTd.textContent = match.fs_A !== null ? `${match.fs_A} - ${match.fs_B}` : 'Not Played';
                tr.appendChild(scoreTd);

                const actionsTd = document.createElement('td');
                actionsTd.className = 'py-2 px-4 border-b';
                if (match.fs_A !== null) { // Match has been played
                    const replayBtn = document.createElement('button');
                    replayBtn.textContent = 'Replay';
                    replayBtn.className = 'bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-3 rounded';
                    replayBtn.onclick = () => loadAndRenderMatchReplay(match.match_id);
                    actionsTd.appendChild(replayBtn);

                    const rolesBtn = document.createElement('button');
                    rolesBtn.textContent = 'Roles';
                    rolesBtn.className = 'bg-purple-500 hover:bg-purple-700 text-white font-bold py-1 px-3 rounded ml-2';
                    rolesBtn.onclick = () => loadAndRenderRolesView(match.match_id);
                    actionsTd.appendChild(rolesBtn);
                }
                tr.appendChild(actionsTd);

                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            contentDiv.appendChild(table);
        }

        let currentMatchData = null;
        let allMatchesData = [];
        let currentEventIndex = 0;
        let isPlaying = false;
        let playbackSpeed = 1;
        let playbackInterval = null;

        async function loadAndRenderMatchReplay(matchId) {
            const url = `${API_BASE_URL}getMatch?match_id=${matchId}`;
            try {
                const matchData = await fetchData(url);
                currentMatchData = matchData;
                renderMatchReplayUI(matchData);
                calculateAndDisplayAdvancedStats(matchData);
                showView('match-replay');
            } catch (error) {
                alert('Failed to load match replay data.');
            }
        }

        function renderMatchReplayUI(data) {
            const contentDiv = document.getElementById('match-replay-content');
            contentDiv.textContent = ''; // Clear previous content

            // Create main layout
            const replayContainer = document.createElement('div');
            replayContainer.className = 'grid grid-cols-1 md:grid-cols-3 gap-4';

            // Left column: Scoreboard and Court
            const leftPanel = document.createElement('div');
            leftPanel.className = 'md:col-span-2 space-y-4';

            const scoreboard = document.createElement('div');
            scoreboard.id = 'scoreboard';
            scoreboard.className = 'bg-white p-4 rounded shadow';
            leftPanel.appendChild(scoreboard);

            const court = document.createElement('div');
            court.id = 'court-visualization';
            court.className = 'bg-green-200 p-4 rounded shadow grid grid-cols-3 grid-rows-2 gap-2 aspect-[2/1]';
            leftPanel.appendChild(court);

            const advancedStats = document.createElement('div');
            advancedStats.id = 'advanced-stats';
            advancedStats.className = 'bg-white p-4 rounded shadow';
            leftPanel.appendChild(advancedStats);

            // Right column: Controls and Log
            const rightPanel = document.createElement('div');
            rightPanel.className = 'space-y-4';

            const controls = document.createElement('div');
            controls.id = 'playback-controls';
            controls.className = 'bg-white p-4 rounded shadow';
            rightPanel.appendChild(controls);

            const eventLog = document.createElement('div');
            eventLog.id = 'event-log';
            eventLog.className = 'bg-white p-4 rounded shadow h-48 overflow-y-auto';
            rightPanel.appendChild(eventLog);

            replayContainer.appendChild(leftPanel);
            replayContainer.appendChild(rightPanel);
            contentDiv.appendChild(replayContainer);

            // Populate controls
            const controlsContainer = document.createElement('div');
            controlsContainer.className = 'flex items-center space-x-2';

            const playPauseBtn = document.createElement('button');
            playPauseBtn.id = 'play-pause-btn';
            playPauseBtn.className = 'bg-blue-500 text-white px-4 py-2 rounded';
            playPauseBtn.textContent = 'Play';
            controlsContainer.appendChild(playPauseBtn);

            const prevEventBtn = document.createElement('button');
            prevEventBtn.id = 'prev-event-btn';
            prevEventBtn.className = 'bg-gray-300 px-4 py-2 rounded';
            prevEventBtn.textContent = '<<';
            controlsContainer.appendChild(prevEventBtn);

            const nextEventBtn = document.createElement('button');
            nextEventBtn.id = 'next-event-btn';
            nextEventBtn.className = 'bg-gray-300 px-4 py-2 rounded';
            nextEventBtn.textContent = '>>';
            controlsContainer.appendChild(nextEventBtn);

            const skipToEndBtn = document.createElement('button');
            skipToEndBtn.id = 'skip-to-end-btn';
            skipToEndBtn.className = 'bg-gray-500 text-white px-4 py-2 rounded';
            skipToEndBtn.textContent = 'Skip to End';
            controlsContainer.appendChild(skipToEndBtn);

            controls.appendChild(controlsContainer);

            const speedContainer = document.createElement('div');
            speedContainer.className = 'mt-4';

            const speedLabel = document.createElement('label');
            speedLabel.htmlFor = 'speed-select';
            speedLabel.textContent = 'Speed:';
            speedContainer.appendChild(speedLabel);

            const speedSelect = document.createElement('select');
            speedSelect.id = 'speed-select';
            speedSelect.className = 'border rounded p-1';

            [1, 2, 5].forEach(speed => {
                const option = document.createElement('option');
                option.value = speed;
                option.textContent = `${speed}x`;
                speedSelect.appendChild(option);
            });
            speedContainer.appendChild(speedSelect);
            controls.appendChild(speedContainer);

            // Initialize view
            resetPlayback();
            updateReplayView();
            addReplayEventListeners();
        }

        function resetPlayback() {
            currentEventIndex = 0;
            isPlaying = false;
            playbackSpeed = 1;
            if (playbackInterval) clearInterval(playbackInterval);
            const playPauseBtn = document.getElementById('play-pause-btn');
            if(playPauseBtn) playPauseBtn.textContent = 'Play';
        }

        function addReplayEventListeners() {
            document.getElementById('play-pause-btn').addEventListener('click', togglePlayPause);
            document.getElementById('next-event-btn').addEventListener('click', nextEvent);
            document.getElementById('prev-event-btn').addEventListener('click', prevEvent);
            document.getElementById('skip-to-end-btn').addEventListener('click', skipToEnd);
            document.getElementById('speed-select').addEventListener('change', (e) => setSpeed(e.target.value));
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            const playPauseBtn = document.getElementById('play-pause-btn');
            playPauseBtn.textContent = isPlaying ? 'Pause' : 'Play';

            if (isPlaying) {
                playbackInterval = setInterval(() => {
                    if (currentEventIndex < currentMatchData.events.length - 1) {
                        currentEventIndex++;
                        updateReplayView();
                    } else {
                        togglePlayPause(); // Auto-pause at the end
                    }
                }, 1000 / playbackSpeed);
            } else {
                clearInterval(playbackInterval);
            }
        }

        function nextEvent() {
            if (currentEventIndex < currentMatchData.events.length - 1) {
                currentEventIndex++;
                updateReplayView();
            }
        }

        function prevEvent() {
            if (currentEventIndex > 0) {
                currentEventIndex--;
                updateReplayView();
            }
        }

        function skipToEnd() {
             if (isPlaying) togglePlayPause();
             currentEventIndex = currentMatchData.events.length - 1;
             updateReplayView();
        }

        function setSpeed(newSpeed) {
            playbackSpeed = Number(newSpeed);
            if (isPlaying) {
                // Reset interval to apply new speed immediately
                togglePlayPause(); // pause
                togglePlayPause(); // and play again
            }
        }

        function updateReplayView() {
            if (!currentMatchData) return;

            const event = currentMatchData.events[currentEventIndex];

            // TODO: Update scoreboard, court, and event log based on the event
            updateScoreboard(currentMatchData, event);
            updateCourtView(currentMatchData, event);

            // Update Event Log
            const eventLog = document.getElementById('event-log');
            const p = document.createElement('p');
            p.textContent = `[${event.wall_time}] ${event.description}`;
            eventLog.prepend(p);
        }

        function updateScoreboard(data, event) {
            const scoreboardDiv = document.getElementById('scoreboard');
            scoreboardDiv.textContent = '';

            const scoreEvent = [...data.events].slice(0, currentEventIndex + 1).reverse().find(e => e.type === 'piste') || {};

            const container = document.createElement('div');
            container.className = 'text-center';

            const teams = document.createElement('h3');
            teams.className = 'font-bold text-lg';
            teams.textContent = `${data.team_A_name} vs ${data.team_B_name}`;
            container.appendChild(teams);

            const finalScore = document.createElement('p');
            finalScore.className = 'text-2xl';
            finalScore.textContent = `${data.fs_A} - ${data.fs_B}`;
            container.appendChild(finalScore);

            const setScores = document.createElement('p');
            setScores.className = 'text-sm';
            let setScoresText = '';
            for (let i = 1; i <= 5; i++) {
                if (data[`p${i}s_A`] !== null) {
                    setScoresText += `Set ${i}: ${data[`p${i}s_A`]}-${data[`p${i}s_B`]} | `;
                }
            }
            setScores.textContent = setScoresText.slice(0, -3);
            container.appendChild(setScores);

            const currentSet = scoreEvent.set_number || 1;
            const currentPoint = document.createElement('p');
            currentPoint.className = 'font-mono text-xl mt-2';
            currentPoint.textContent = `Current Point: ${scoreEvent[`p${currentSet}s_A`] || 0} - ${scoreEvent[`p${currentSet}s_B`] || 0}`;
            container.appendChild(currentPoint);

            scoreboardDiv.appendChild(container);
        }

        function updateCourtView(data, event) {
            const courtDiv = document.getElementById('court-visualization');
            courtDiv.innerHTML = ''; // Clear court

            const teamLineup = data.lineups.filter(p => p.team_id === data.team_A_id); // Assuming we are visualizing team A

            let currentPositions = {};
            // Find the last 'pelipaikat' event to get current positions
            const positionEvent = [...data.events].slice(0, currentEventIndex + 1).reverse().find(e => e.type === 'pelipaikat');

            if (positionEvent) {
                for (let i = 1; i <= 6; i++) {
                    const playerId = positionEvent.home_positions[i];
                    const player = teamLineup.find(p => p.player_id == playerId);
                    const cell = document.createElement('div');
                    cell.className = 'border-2 border-gray-500 flex flex-col items-center justify-center bg-white rounded';
                    cell.style.gridArea = ` ${Math.floor((i-1)/3) + 1} / ${(i-1)%3 + 1}`; // Simple grid layout
                     if (i <= 3) { // Back row
                        cell.style.gridRow = "2";
                        cell.style.gridColumn = `${4-i}`;
                    } else { // Front row
                        cell.style.gridRow = "1";
                        cell.style.gridColumn = `${i-3}`;
                    }


                    const playerName = document.createElement('span');
                    playerName.className = 'font-bold text-sm';
                    playerName.textContent = player ? player.player_name : 'N/A';

                    const playerNumber = document.createElement('span');
                    playerNumber.className = 'text-xs text-gray-600';
                    playerNumber.textContent = player ? `#${player.shirt_number}` : '';

                    cell.appendChild(playerName);
                    cell.appendChild(playerNumber);
                    courtDiv.appendChild(cell);
                }
            } else {
                 courtDiv.textContent = 'Waiting for lineup information...';
            }
        }

        function calculateAndDisplayAdvancedStats(data) {
            const statsDiv = document.getElementById('advanced-stats');
            statsDiv.textContent = '';

            const title = document.createElement('h3');
            title.className = 'font-bold text-lg mb-2';
            title.textContent = 'Advanced Match Stats';
            statsDiv.appendChild(title);

            const teamA = data.team_A_id;
            const teamB = data.team_B_id;

            let sideoutOpportunitiesA = 0, sideoutsA = 0, breakPointsA = 0;
            let sideoutOpportunitiesB = 0, sideoutsB = 0, breakPointsB = 0;
            let pointsAfterTimeoutA = { won: 0, lost: 0 };
            let pointsAfterTimeoutB = { won: 0, lost: 0 };
            let servingStreaks = {};
            let currentServerId = null, currentStreak = 0;
            let servingTeamId = data.events.find(e => e.type === 'aloittavajoukkue')?.team_id;

            for (let i = 0; i < data.events.length; i++) {
                const event = data.events[i];

                if (event.type === 'piste') {
                    const scoringTeamId = event.team_id;
                    const isHomeTeamServing = servingTeamId === teamA;

                    if (isHomeTeamServing) {
                        sideoutOpportunitiesB++;
                        if (scoringTeamId === teamB) {
                            sideoutsB++;
                            servingTeamId = teamB;
                        } else {
                            breakPointsA++;
                        }
                    } else { // Away team serving
                        sideoutOpportunitiesA++;
                        if (scoringTeamId === teamA) {
                            sideoutsA++;
                            servingTeamId = teamA;
                        } else {
                            breakPointsB++;
                        }
                    }

                    const prevEvent = data.events[i - 1];
                    if (prevEvent && prevEvent.type === 'aikalisa') {
                        if (prevEvent.team_id === teamA) scoringTeamId === teamA ? pointsAfterTimeoutA.won++ : pointsAfterTimeoutA.lost++;
                        else scoringTeamId === teamB ? pointsAfterTimeoutB.won++ : pointsAfterTimeoutB.lost++;
                    }

                    // Correctly identify server for streak calculation
                    const positionEvent = [...data.events].slice(0, i + 1).reverse().find(e => e.type === 'pelipaikat');
                    if (positionEvent) {
                        const serverPlayerId = isHomeTeamServing ? positionEvent.home_positions['1'] : positionEvent.away_positions['1'];
                        if (scoringTeamId === servingTeamId) {
                            if (currentServerId === serverPlayerId) {
                                currentStreak++;
                            } else {
                                currentServerId = serverPlayerId;
                                currentStreak = 1;
                            }
                            const playerName = data.lineups.find(p => p.player_id == currentServerId)?.player_name || 'Unknown';
                            if (!servingStreaks[currentServerId] || currentStreak > servingStreaks[currentServerId].streak) {
                                servingStreaks[currentServerId] = { streak: currentStreak, player: playerName };
                            }
                        } else {
                            currentServerId = null;
                            currentStreak = 0;
                        }
                    }
                }
            }

            const sideoutPercentageA = sideoutOpportunitiesA > 0 ? ((sideoutsA / sideoutOpportunitiesA) * 100).toFixed(1) : 'N/A';
            const sideoutPercentageB = sideoutOpportunitiesB > 0 ? ((sideoutsB / sideoutOpportunitiesB) * 100).toFixed(1) : 'N/A';
            const longestStreak = Object.values(servingStreaks).sort((a, b) => b.streak - a.streak)[0];

            const table = document.createElement('table');
            table.className = 'w-full text-sm';
            const tbody = document.createElement('tbody');

            tbody.innerHTML = `
                <tr><td class="font-semibold">${data.team_A_name}</td><td class="font-semibold">${data.team_B_name}</td></tr>
                <tr><td>Side-Out %: ${sideoutPercentageA}%</td><td>Side-Out %: ${sideoutPercentageB}%</td></tr>
                <tr><td>Break Points: ${breakPointsA}</td><td>Break Points: ${breakPointsB}</td></tr>
                <tr><td>Points After Timeout: ${pointsAfterTimeoutA.won} Won / ${pointsAfterTimeoutA.lost} Lost</td><td>Points After Timeout: ${pointsAfterTimeoutB.won} Won / ${pointsAfterTimeoutB.lost} Lost</td></tr>
            `;
             if (longestStreak) {
                const streakRow = document.createElement('tr');
                const streakCell = document.createElement('td');
                streakCell.colSpan = 2;
                streakCell.className = 'pt-2';
                streakCell.innerHTML = `<span class="font-semibold">Longest Serve Streak:</span> ${longestStreak.player} (${longestStreak.streak} points)`;
                streakRow.appendChild(streakCell);
                tbody.appendChild(streakRow);
            }

            table.appendChild(tbody);
            statsDiv.appendChild(table);
        }

        async function calculateAndRenderAggregateStats() {
            const playedMatches = allMatchesData.filter(m => m.fs_A !== null);
            let allPlayerStats = {};
            let allRotationStats = {1: {plus: 0, minus: 0}, 2: {plus: 0, minus: 0}, 3: {plus: 0, minus: 0}, 4: {plus: 0, minus: 0}, 5: {plus: 0, minus: 0}, 6: {plus: 0, minus: 0}};
            let opponentStats = { totalPoints: 0, impliedErrors: 0 };

            for(const match of playedMatches) {
                const matchData = await fetchData(`${API_BASE_URL}getMatch?match_id=${match.match_id}`);
                const teamId = matchData.team_A_id; // Assume team A is our team
                const opponentId = matchData.team_B_id;

                // Simple point aggregation from lineups
                matchData.lineups.forEach(p => {
                    if(!allPlayerStats[p.player_id]) {
                        allPlayerStats[p.player_id] = { name: p.player_name, points: 0, plusMinus: 0, gamesPlayed: 0, serves: 0, blocks: 0 };
                    }
                    if(p.team_id == teamId) {
                         allPlayerStats[p.player_id].points += p.points_scored;
                         allPlayerStats[p.player_id].gamesPlayed++;
                    }
                });

                 // More detailed event-based aggregation
                let onCourt = new Set();
                let currentSetterPosition = 1;

                matchData.events.forEach(event => {
                    if (event.type === 'pelipaikat') {
                        onCourt = new Set(Object.values(event.home_positions));
                        const matchId = matchData.match_id;
                        if(matchRoles[matchId]) {
                            const setterEntry = Object.entries(matchRoles[matchId]).find(([pid, role]) => role === 'Setter');
                            if(setterEntry) {
                                const setterId = setterEntry[0];
                                const setterPosEntry = Object.entries(event.home_positions).find(([pos, pid]) => pid == setterId);
                                if(setterPosEntry) currentSetterPosition = setterPosEntry[0];
                            }
                        }
                    }

                    if (event.type === 'piste' && event.block_player_id && allPlayerStats[event.block_player_id]) {
                        allPlayerStats[event.block_player_id].blocks++;
                    }

                    if (event.type === 'Syöttö' && event.player_id && allPlayerStats[event.player_id]) {
                        allPlayerStats[event.player_id].serves++;
                    }

                    if (event.type === 'piste') {
                        const scoringTeam = event.team_id;
                        if (scoringTeam == teamId) {
                            onCourt.forEach(pid => allPlayerStats[pid] ? allPlayerStats[pid].plusMinus++ : null);
                             if (allRotationStats[currentSetterPosition]) allRotationStats[currentSetterPosition].plus++;
                        } else {
                            onCourt.forEach(pid => allPlayerStats[pid] ? allPlayerStats[pid].plusMinus-- : null);
                             if (allRotationStats[currentSetterPosition]) allRotationStats[currentSetterPosition].minus++;
                             opponentStats.totalPoints++;
                             if(event.player_id == '1' || !event.player_id) opponentStats.impliedErrors++;
                        }
                    }
                });
            }

            currentAggregatedStats = { playerStats: allPlayerStats, rotationStats: allRotationStats }; // Store for AI analysis
            renderAggregateTables(allPlayerStats, opponentStats);
            renderAggregateCharts(allPlayerStats, allRotationStats);
            renderAIAnalysisView();
            showView('stats');
        }

        function renderAggregateTables(playerStats, opponentStats) {
            const teamTableDiv = document.getElementById('team-stats-table');
            const opponentTableDiv = document.getElementById('opponent-stats-table');

            // Team stats table
            const table = document.createElement('table');
            table.className = 'min-w-full bg-white border';

            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headerRow.className = 'bg-gray-200 text-left';
            ['Player', 'Points', '+/-', 'Games Played', 'Serves', 'Blocks'].forEach(text => {
                const th = document.createElement('th');
                th.className = 'py-2 px-4 border-b';
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            Object.values(playerStats).sort((a, b) => b.points - a.points).forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-2 px-4 border-b">${p.name}</td>
                    <td class="py-2 px-4 border-b">${p.points}</td>
                    <td class="py-2 px-4 border-b">${p.plusMinus}</td>
                    <td class="py-2 px-4 border-b">${p.gamesPlayed}</td>
                    <td class="py-2 px-4 border-b">${p.serves}</td>
                    <td class="py-2 px-4 border-b">${p.blocks}</td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            teamTableDiv.textContent = '';
            teamTableDiv.appendChild(table);

            // Opponent stats
            const opponentP = document.createElement('p');
            opponentP.textContent = `Total points scored by opponents: ${opponentStats.totalPoints} | Total implied errors: ${opponentStats.impliedErrors}`;
            opponentTableDiv.textContent = '';
            opponentTableDiv.appendChild(opponentP);
        }

        let pointsChart, plusMinusChart, rotationChart;
        function renderAggregateCharts(playerStats, rotationStats) {
            const sortedPlayersByPoints = Object.values(playerStats).sort((a, b) => b.points - a.points);
            const sortedPlayersByPlusMinus = Object.values(playerStats).sort((a, b) => b.plusMinus - a.plusMinus);

            if(pointsChart) pointsChart.destroy();
            pointsChart = new Chart(document.getElementById('points-chart'), {
                type: 'bar',
                data: {
                    labels: sortedPlayersByPoints.map(p => p.name),
                    datasets: [{ label: 'Total Points', data: sortedPlayersByPoints.map(p => p.points), backgroundColor: 'rgba(54, 162, 235, 0.6)' }]
                }
            });

            if(plusMinusChart) plusMinusChart.destroy();
            plusMinusChart = new Chart(document.getElementById('plus-minus-chart'), {
                type: 'bar',
                data: {
                    labels: sortedPlayersByPlusMinus.map(p => p.name),
                    datasets: [{ label: 'Plus/Minus', data: sortedPlayersByPlusMinus.map(p => p.plusMinus), backgroundColor: 'rgba(75, 192, 192, 0.6)' }]
                }
            });

            if(rotationChart) rotationChart.destroy();
            rotationChart = new Chart(document.getElementById('rotation-chart'), {
                 type: 'bar',
                data: {
                    labels: ['Rotation 1', 'Rotation 2', 'Rotation 3', 'Rotation 4', 'Rotation 5', 'Rotation 6'],
                    datasets: [{ label: 'Rotation +/-', data: Object.values(rotationStats).map(r => r.plus - r.minus), backgroundColor: 'rgba(255, 159, 64, 0.6)' }]
                }
            });

            // Add event listeners for export buttons
            document.getElementById('export-csv-btn').onclick = () => exportStatsToCSV(playerStats);
            document.getElementById('export-json-btn').onclick = () => exportStatsToJSON(playerStats);
        }

        function exportStatsToCSV(playerStats) {
            const headers = "Player,Points,PlusMinus,GamesPlayed";
            const csvContent = "data:text/csv;charset=utf-8,"
                + headers + "\\n"
                + Object.values(playerStats).map(p => `${p.name},${p.points},${p.plusMinus},${p.gamesPlayed}`).join("\\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "team_stats.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportStatsToJSON(playerStats) {
            const jsonContent = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(Object.values(playerStats), null, 2));
            const link = document.createElement("a");
            link.setAttribute("href", jsonContent);
            link.setAttribute("download", "team_stats.json");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function loadAndRenderRolesView(matchId) {
            const url = `${API_BASE_URL}getMatch?match_id=${matchId}`;
            try {
                const matchData = await fetchData(url);
                renderRolesUI(matchData);
                showView('roles');
            } catch (error) {
                alert('Failed to load match data for role assignment.');
            }
        }

        function renderRolesUI(data) {
            const contentDiv = document.getElementById('roles-content');
            contentDiv.textContent = '';
            const teamId = data.team_A_id;
            const players = data.lineups.filter(p => p.team_id == teamId);

            const container = document.createElement('div');

            const sets = [...new Set(data.events.map(e => e.set_number))].filter(Boolean);

            sets.forEach(setNum => {
                const setContainer = document.createElement('div');
                setContainer.className = 'bg-white p-4 rounded shadow mb-4';

                const title = document.createElement('h3');
                title.className = 'font-bold text-lg';
                title.textContent = `Auto-Assign Roles for Set ${setNum}`;
                setContainer.appendChild(title);

                const controls = document.createElement('div');
                controls.className = 'flex items-center space-x-4 mt-2';

                controls.innerHTML = `
                    <div>
                        <label for="setter-select-set${setNum}" class="block text-sm font-medium">Select Setter:</label>
                        <select id="setter-select-set${setNum}" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                            ${players.map(p => `<option value="${p.player_id}">${p.player_name}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label for="setter-position-select-set${setNum}" class="block text-sm font-medium">Setter's Starting Position:</label>
                         <select id="setter-position-select-set${setNum}" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                            ${[1,2,3,4,5,6].map(p => `<option value="${p}">${p}</option>`).join('')}
                        </select>
                    </div>
                `;
                const assignBtn = document.createElement('button');
                assignBtn.className = 'bg-blue-500 text-white px-4 py-2 rounded self-end';
                assignBtn.textContent = 'Auto-Assign';
                assignBtn.onclick = () => autoAssignRoles(data, setNum);
                controls.appendChild(assignBtn);
                setContainer.appendChild(controls);
                container.appendChild(setContainer);
            });


            // Player table
            const table = document.createElement('table');
            table.id = "roles-table";
            table.className = 'min-w-full bg-white border';
            table.innerHTML = `
                <thead class="bg-gray-200 text-left">
                    <tr>
                        <th class="py-2 px-4 border-b">Player</th>
                        <th class="py-2 px-4 border-b">Assigned Role</th>
                    </tr>
                </thead>
            `;
            const tbody = document.createElement('tbody');
            players.forEach(p => {
                const tr = document.createElement('tr');
                tr.dataset.playerId = p.player_id;
                tr.innerHTML = `
                    <td class="py-2 px-4 border-b">${p.player_name}</td>
                    <td class="py-2 px-4 border-b role-cell">Not Assigned</td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
            contentDiv.appendChild(container);
        }

        let matchRoles = {}; // Store roles per match: { matchId: { playerId: role } }

        function autoAssignRoles(data, setNum) {
            const setterId = document.getElementById(`setter-select-set${setNum}`).value;

            const setStartersEvent = data.events.find(e => e.type === 'aloittajakso' && e.set_number == setNum);
            if (!setStartersEvent) {
                alert(`Could not find starting lineup for Set ${setNum}.`);
                return;
            }
            const starters = setStartersEvent.home_starters; // Assuming home team

            // Role mapping based on position relative to the setter (in a 5-1 system)
            const roleMap = {
                0: 'Setter',
                1: 'Outside Hitter',
                2: 'Middle Blocker',
                3: 'Opposite',
                4: 'Outside Hitter',
                5: 'Middle Blocker'
            };

            const setterIndex = starters.indexOf(parseInt(setterId, 10));
             if (!matchRoles[data.match_id]) matchRoles[data.match_id] = {};

            starters.forEach((playerId, index) => {
                const positionOffset = (index - setterIndex + 6) % 6;
                const role = roleMap[positionOffset];
                matchRoles[data.match_id][playerId] = role;
                updatePlayerRoleInTable(playerId, role);
            });

            // Auto-identify Liberos
            const liberoidPlayers = identifyLiberos(data);
            liberoidPlayers.forEach(playerId => {
                 matchRoles[data.match_id][playerId] = 'Libero';
                 updatePlayerRoleInTable(playerId, 'Libero');
            });
        }

        function identifyLiberos(data) {
            const subEvents = data.events.filter(e => e.type === 'vaihto');
            const playerSubCounts = {};
            const playersWhoServe = new Set();

            data.events.forEach(e => {
                if(e.type === 'piste' && e.serving_player_id) {
                    playersWhoServe.add(e.serving_player_id);
                }
            });

            subEvents.forEach(sub => {
                if(sub.player_in_id) {
                    playerSubCounts[sub.player_in_id] = (playerSubCounts[sub.player_in_id] || 0) + 1;
                }
            });

            // A simple heuristic: a player who subs in frequently but never serves is likely a Libero
            const potentialLiberos = Object.keys(playerSubCounts).filter(id =>
                playerSubCounts[id] > 2 && !playersWhoServe.has(parseInt(id, 10))
            );

            return potentialLiberos;
        }

        function updatePlayerRoleInTable(playerId, role) {
            const row = document.querySelector(`#roles-table tr[data-player-id='${playerId}']`);
            if (row) {
                const cell = row.querySelector('.role-cell');
                cell.textContent = role;
            }
        }

        let currentAggregatedStats = null;
        function renderAIAnalysisView() {
             document.getElementById('ai-analysis-btn').onclick = () => showView('ai-analysis');
             document.getElementById('get-insights-btn').onclick = getAIInsights;
        }

        async function getAIInsights() {
            const apiKey = document.getElementById('openrouter-key').value;
            const model = document.getElementById('ai-model-select').value;
            const responseDiv = document.getElementById('ai-response');

            if (!apiKey) {
                alert('Please enter your OpenRouter API key.');
                return;
            }

            responseDiv.textContent = 'Getting insights...';

            const prompt = `
                Analyze the following volleyball team's season statistics.
                Provide insights on performance trends, strongest and weakest rotations, key player analysis (based on points and +/-), and predictions for the next match.
                Data: ${JSON.stringify(currentAggregatedStats, null, 2)}
            `;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": model,
                        "messages": [
                            { "role": "user", "content": prompt }
                        ]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API request failed with status ${response.status}`);
                }

                const data = await response.json();
                responseDiv.textContent = data.choices[0].message.content;

            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }
    </script>
